<div class="flex flex-col gap-6">
  @if (loadError()) {
    <app-alert variant="error" [message]="loadError()" />
  }

  @if (loadingData()) {
    <div class="flex items-center justify-center py-12">
      <div class="flex flex-col items-center gap-3">
        <svg
          class="h-10 w-10 animate-spin text-sky-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <p class="text-sm text-gray-600">Cargando producto...</p>
      </div>
    </div>
  } @else {
    <form (submit)="submit($event)" class="flex flex-col gap-6" novalidate>
      <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Información general</h2>
          <p class="mt-1 text-sm text-gray-500">
            Datos base del producto: género, almacén y nombre.
          </p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <app-button
            type="submit"
            variant="secondary"
            icon="save"
            [loading]="saving()"
            [disabled]="saving()">
            {{ isEditing() ? 'Guardar' : 'Crear producto' }}
          </app-button>
          <a
            routerLink="/inventories/products"
            class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors hover:bg-gray-50">
            Regresar
          </a>
        </div>
      </div>

      <div class="grid gap-6 md:grid-cols-2">
        <app-select
          label="Género *"
          placeholder="Seleccione género"
          [options]="genderOptions()"
          [formField]="productForm.genderId"
          [errorMessage]="genderError()" />

        <app-select
          label="Almacén *"
          placeholder="Seleccione almacén"
          [options]="warehouseOptions()"
          [formField]="productForm.warehouseId"
          [errorMessage]="warehouseError()" />
      </div>

      <app-input
        type="text"
        label="Nombre del producto *"
        placeholder="Ingrese nombre del producto"
        [formField]="productForm.name"
        [errorMessage]="nameError()" />

      @if (isEditing() && productId()) {
        <app-product-ai-insights-panel [productId]="productId()!" />
      }
    </form>
  }
</div>
