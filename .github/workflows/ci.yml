name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build (docker configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration=docker

  deploy:
    name: Trigger production deploy
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch deploy to nm-deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: jhon78963/nm-deploy
          event-type: deploy-production
          client-payload: |
            {
              "repo": "nm-frontend-v2",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref_name }}"
            }
